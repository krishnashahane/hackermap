<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
    <title>CYBER THREAT MAP — Simulated Global Attack Activity</title>
    <meta name="description" content="A browser-based cybersecurity visualization that simulates global attack activity on an interactive 3D globe.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header">
        <div class="header-left">
            <span class="logo">&#9763; CYBER THREAT MAP</span>
            <span class="status-dot"></span>
            <span class="status-text">SIMULATED LIVE</span>
        </div>
        <div class="header-right">
            <div class="stat-box">
                <span class="stat-label">ATTACKS / MIN</span>
                <span class="stat-value" id="attacks-per-min">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">TOTAL EVENTS</span>
                <span class="stat-value" id="total-attacks">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">UPTIME</span>
                <span class="stat-value" id="uptime">00:00:00</span>
            </div>
        </div>
    </header>

    <main id="main">
        <aside id="feed-panel" aria-label="Simulated attack feed">
            <div class="panel-header">
                <span>&#9889; SIMULATED ATTACK FEED</span>
            </div>
            <div id="feed-list"></div>
        </aside>

        <div id="globe-container" aria-label="3D simulated cyber attack map"></div>
    </main>

    <footer id="stats-bar">
        <div class="stats-section">
            <h3>TOP SIMULATED ORIGINS</h3>
            <div id="top-countries"></div>
        </div>
        <div class="stats-section">
            <h3>TOP SIMULATED ATTACK TYPES</h3>
            <div id="top-types"></div>
        </div>
        <div class="stats-section">
            <h3>TOP SIMULATED TARGET PORTS</h3>
            <div id="top-ports"></div>
        </div>
    </footer>

    <noscript>
        <div class="noscript-message">JavaScript is required to run the visualization.</div>
    </noscript>

    <script defer src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
    <script defer src="app.js"></script>
</body>
</html>
